<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GNS | America’s Number One Source for News</title>
<meta property="og:title" content="GNS | America’s Number One Source for News">
<meta name="description" content="Breaking news, politics, global affairs and opinion from GNS.">
<meta property="og:description" content="Breaking news, politics, global affairs and opinion from GNS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&family=Fira+Sans+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #8e1c13;
    --brand-dark: #6d140d;
    --bg: #ffffff;
    --ink: #111111;
    --muted: #5f5f5f;
    --rule: #e2e2e2;
    --soft: #f4f4f4;
    --kicker: #8e1c13;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--brand);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --ink: #f2f2f2; --muted: #a8a8a8; --rule: #333; --soft: #1e1e1e; --kicker: #ff6b5e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414; --ink: #f2f2f2; --muted: #a8a8a8; --rule: #333; --soft: #1e1e1e; --kicker: #ff6b5e;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Fira Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font: inherit; }

  /* Masthead */
  .masthead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: #fff; }
  .bar { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 28px; }
  .logo { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; flex: none; }
  .logo-word { font-weight: 800; font-size: 26px; letter-spacing: 0.02em; }
  .logo svg { margin-top: 4px; }
  .nav { display: none; gap: 22px; flex: 1; }
  .nav a { font-weight: 600; font-size: 16px; padding: 6px 0; border-bottom: 2px solid transparent; }
  .nav a.active, .nav a:hover { border-bottom-color: #fff; }
  .icons { display: flex; gap: 16px; align-items: center; margin-left: auto; }
  .icon-btn { background: none; border: 0; padding: 6px; color: inherit; cursor: pointer; border-radius: 6px; }
  .icon-btn:focus-visible, a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  @media (min-width: 900px) { .nav { display: flex; } }

  .search, .drawer { display: none; }
  .search.open, .drawer.open { display: block; }
  .search { max-width: 1200px; margin: 0 auto; padding: 0 20px 14px; }
  .search input { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border: 0; border-radius: 6px; }
  .results { margin-top: 8px; }
  .results a, .results p { display: block; color: #fff; padding: 8px 0; font-size: 16px; margin: 0; border-bottom: 1px solid rgba(255,255,255,0.15); }
  .drawer { border-top: 1px solid rgba(255,255,255,0.25); }
  .drawer ul { list-style: none; margin: 0 auto; padding: 8px 20px 16px; max-width: 1200px; }
  .drawer a { display: block; padding: 11px 0; font-weight: 600; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.15); }
  .drawer li:last-child a { border-bottom: 0; }

  /* Sub-bar (section strip, like a cable-news homepage) */
  .strip { background: var(--brand-dark); color: #fff; overflow-x: auto; }
  .strip-inner { max-width: 1200px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 20px; white-space: nowrap; font-size: 14px; font-weight: 500; }
  .strip a { opacity: 0.9; }
  .strip a.active { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
  @media (min-width: 900px) { .strip { display: none; } }

  main { background: var(--bg); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 56px; }

  /* Home */
  .kicker { color: var(--kicker); font-weight: 700; font-size: 13px; margin-bottom: 6px; display: block; }
  .home-grid { display: grid; gap: 24px; grid-template-columns: 1fr; }
  .lead { order: 1; }
  .rail-left { order: 2; }
  .rail-right { order: 3; }
  @media (min-width: 900px) {
    .home-grid { grid-template-columns: 240px 1fr 280px; }
    .rail-left { order: 1; } .lead { order: 2; } .rail-right { order: 3; }
  }
  .lead-img { aspect-ratio: 16 / 9; overflow: hidden; background: var(--soft); }
  .lead-img img { width: 100%; height: 100%; object-fit: cover; }
  .lead h2 {
    font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif;
    font-weight: 800; font-size: clamp(30px, 6vw, 48px); line-height: 1.04;
    margin: 14px 0 10px; text-transform: uppercase;
  }
  .lead h2 a:hover { text-decoration: underline; text-decoration-thickness: 3px; }
  .dek { overflow-wrap: anywhere; font-size: 18px; line-height: 1.45; color: var(--muted); margin: 0; max-width: 60ch; }

  .rail h3 {
    font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif;
    font-size: 20px; font-weight: 800; margin: 0 0 10px; padding-bottom: 8px;
    border-bottom: 3px solid var(--brand);
  }
  .story { display: grid; grid-template-columns: 1fr 104px; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .story.noimg { grid-template-columns: 1fr; }
  .story .thumb { aspect-ratio: 4 / 3; overflow: hidden; background: var(--soft); }
  .story .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .story h4 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 700; }
  .story:hover h4 { text-decoration: underline; }
  .empty { color: var(--muted); font-size: 15px; padding: 12px 0; margin: 0; }

  .more { margin-top: 36px; }
  .more h3 {
    font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif;
    font-size: 24px; font-weight: 800; margin: 0 0 6px; padding-bottom: 8px; border-bottom: 3px solid var(--brand);
  }
  .card-grid { display: grid; gap: 22px; grid-template-columns: 1fr; margin-top: 16px; }
  @media (min-width: 640px) { .card-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 900px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }
  .card .thumb { aspect-ratio: 16 / 9; overflow: hidden; background: var(--soft); margin-bottom: 10px; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card h4 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; }
  .card:hover h4 { text-decoration: underline; }

  /* Section page */
  .section-title {
    font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif;
    font-weight: 800; font-size: clamp(32px, 6vw, 52px); margin: 4px 0 4px;
  }
  .section-rule { border: 0; border-top: 4px solid var(--brand); margin: 0 0 8px; }
  .list .story { grid-template-columns: 1fr 140px; }
  @media (min-width: 640px) { .list .story { grid-template-columns: 1fr 220px; } .list .story h4 { font-size: 22px; } }

  /* Article */
  .article { max-width: 1000px; margin: 0 auto; padding: 24px 20px 56px; }
  .article h1 {
    margin: 0 0 22px; font-weight: 700; text-transform: uppercase;
    font-size: clamp(28px, 6.2vw, 58px); line-height: 1.05; text-align: center;
  }
  .article .photo { width: 100%; aspect-ratio: 1899 / 721; overflow: hidden; background: var(--soft); }
  .article .photo img { width: 100%; height: 100%; object-fit: cover; }
  .article .inline-photo { margin: 24px 0; }
  .article .inline-photo img { width: 100%; height: auto; display: block; }
  .art-dek { text-align: center; font-size: clamp(18px, 2.4vw, 22px); line-height: 1.4; color: var(--muted); margin: -8px auto 22px; max-width: 60ch; }
  .meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .meta p { margin: 0; }
  .tag { white-space: nowrap; }
  .body { margin-top: 18px; overflow-wrap: anywhere; }
  .body p { font-size: 19px; line-height: 1.5; margin: 0 0 1em; max-width: 75ch; }
  .body .subhead {
    font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif;
    font-weight: 800; font-size: clamp(24px, 3.4vw, 30px); line-height: 1.15; margin: 1.5em 0 0.5em; max-width: 75ch;
  }
  .body ul { margin: 0 0 1em; padding-left: 1.2em; max-width: 75ch; }
  .body li { font-size: 19px; line-height: 1.5; font-weight: 600; margin-bottom: 0.3em; }
  .body li::marker { color: var(--brand); }
  .body blockquote { margin: 1.2em 0 1.4em; padding: 4px 0 4px 20px; border-left: 5px solid var(--brand); max-width: 75ch; }
  .body blockquote p {
    font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif;
    font-weight: 700; font-size: clamp(22px, 3vw, 28px); line-height: 1.25; margin: 0 0 0.35em;
  }
  .body blockquote p:last-child { margin-bottom: 0; }
  @media (min-width: 700px) { .body p { font-size: 21px; } .body li { font-size: 21px; } .meta { font-size: 16px; } }
  .back { display: inline-block; margin-top: 18px; font-weight: 600; color: var(--kicker); }

  /* Cartoons */
  .toon-grid { display: grid; gap: 22px; grid-template-columns: 1fr; margin-top: 16px; }
  @media (min-width: 640px) { .toon-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 900px) { .toon-grid.four { grid-template-columns: repeat(4, 1fr); } .toon-grid.three { grid-template-columns: repeat(3, 1fr); } }
  .toon-card { display: block; }
  .toon-card .frame { aspect-ratio: 4 / 3; background: var(--soft); border: 1px solid var(--rule); overflow: hidden; display: grid; place-items: center; margin-bottom: 10px; }
  .toon-card .frame img { width: 100%; height: 100%; object-fit: contain; }
  .toon-card h4 { margin: 0; font-size: 19px; line-height: 1.2; font-weight: 700; }
  .toon-card p { margin: 6px 0 0; color: var(--muted); font-size: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .toon-card:hover h4 { text-decoration: underline; }
  .band-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 3px solid var(--brand); padding-bottom: 8px; }
  .band-head h3 { border: 0 !important; padding: 0 !important; margin: 0 !important; }
  .band-head a { font-weight: 600; font-size: 15px; color: var(--kicker); white-space: nowrap; }
  .toon-full { margin: 0; background: var(--soft); border: 1px solid var(--rule); }
  .toon-full img { width: 100%; height: auto; display: block; margin: 0 auto; max-height: 85vh; object-fit: contain; }
  .toon-caption { font-size: clamp(19px, 2.4vw, 22px); line-height: 1.45; text-align: center; font-style: italic; margin: 18px auto 0; max-width: 60ch; overflow-wrap: anywhere; }

  footer { background: var(--brand); color: #fff; }
  footer .wrap { padding: 22px 20px; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
</style>
</head>

  if (id === "cartoons") return `<div class="wrap">
    <h1 class="section-title">Cartoons</h1><hr class="section-rule">
    ${list.length ? `<div class="toon-grid three">${list.map(toonCard).join("")}</div>` : `<p class="empty">No cartoons yet. Check the <a href="#/" style="text-decoration:underline">front page</a> for the latest.</p>`}
  </div>`;
  return `<div class="wrap">
    <h1 class="section-title">${esc(s.name)}</h1><hr class="section-rule">
    <div class="list">${list.length ? list.map(storyRow).join("") : `<p class="empty">No ${esc(s.name)} stories yet. Check the <a href="#/" style="text-decoration:underline">front page</a> for the latest.</p>`}</div>
  </div>`;
}

function viewArticle(slug) {
  const a = ARTICLES.find(x => x.slug === slug);
  if (!a) return viewNotFound();
  document.title = a.title + " | GNS";
  if (isToon(a)) return `<article class="article">
    <h1>${esc(a.title)}</h1>
    ${a.image && IMAGES[a.image] ? `<figure class="toon-full"><img src="${IMAGES[a.image]}" alt="${esc(a.imageAlt || a.title)}"></figure>` : ""}
    ${caption(a) ? `<p class="toon-caption">${esc(caption(a))}</p>` : ""}
    <div class="meta">
      <div><p>Cartoon by ${esc(a.author)}${a.role ? ", " + esc(a.role) : ""}</p><p>Published on ${esc(a.published)}</p></div>
      ${a.tag ? `<div class="tag">${esc(a.tag)}</div>` : ""}
    </div>
    <a class="back" href="#/section/cartoons">More cartoons</a>
  </article>`;
  return `<article class="article">
    <h1>${esc(a.title)}</h1>
    ${a.dek ? `<p class="art-dek">${esc(a.dek)}</p>` : ""}
    ${a.ratio ? img(a, "photo").replace('class="photo"', `class="photo" style="aspect-ratio:${a.ratio}"`) : img(a, "photo")}
    <div class="meta">
      <div><p>By ${esc(a.author)}, ${esc(a.role)}</p><p>Published on ${esc(a.published)}</p></div>
      ${a.tag ? `<div class="tag">${esc(a.tag)}</div>` : ""}
    </div>
    <div class="body">${a.body.map(block).join("")}</div>
    <a class="back" href="#/">Back to the front page</a>
  </article>`;
}

function viewNotFound() {
  return `<div class="wrap"><h1 class="section-title">Page not found</h1><hr class="section-rule">
    <p class="empty">This page doesn't exist. Go to the <a href="#/" style="text-decoration:underline">front page</a>.</p></div>`;
}

/* ===== Router ===== */
function navLinks(active) {
  return SECTIONS.map(s => `<a href="#/section/${s.id}" class="${active === s.id ? "active" : ""}">${esc(s.name)}</a>`).join("");
}
function render() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  let html, active = null;
  document.title = "GNS | America’s Number One Source for News";
  if (!parts[0]) html = viewHome();
  else if (parts[0] === "section") { active = parts[1]; html = viewSection(parts[1]); }
  else if (parts[0] === "article") html = viewArticle(parts[1]);
  else html = viewNotFound();
  if (active) document.title = sectionName(active) + " | GNS";
  document.getElementById("app").innerHTML = html;
  document.getElementById("nav").innerHTML = navLinks(active);
  document.getElementById("strip").innerHTML = navLinks(active);
  document.getElementById("drawerList").innerHTML =
    `<li><a href="#/">Home</a></li>` + SECTIONS.map(s => `<li><a href="#/section/${s.id}">${esc(s.name)}</a></li>`).join("");
  closePanels();
  window.scrollTo(0, 0);
}

/* ===== Search & menu ===== */
const searchBtn = document.getElementById("searchBtn"), menuBtn = document.getElementById("menuBtn");
const search = document.getElementById("search"), drawer = document.getElementById("drawer");
const input = document.getElementById("searchInput"), results = document.getElementById("results");
function closePanels() {
  search.classList.remove("open"); drawer.classList.remove("open");
  searchBtn.setAttribute("aria-expanded", false); menuBtn.setAttribute("aria-expanded", false);
}
searchBtn.addEventListener("click", () => {
  const open = !search.classList.contains("open"); closePanels();
  if (open) { search.classList.add("open"); searchBtn.setAttribute("aria-expanded", true); input.focus(); }
});
menuBtn.addEventListener("click", () => {
  const open = !drawer.classList.contains("open"); closePanels();
  if (open) { drawer.classList.add("open"); menuBtn.setAttribute("aria-expanded", true); }
});
input.addEventListener("input", () => {
  const q = input.value.trim().toLowerCase();
  if (!q) { results.innerHTML = ""; return; }
  const hits = ARTICLES.filter(a => (a.title + " " + bodyText(a)).toLowerCase().includes(q));
  results.innerHTML = hits.length
    ? hits.map(a => `<a href="${link(a)}">${esc(a.title)}</a>`).join("")
    : `<p>No stories match "${esc(input.value.trim())}".</p>`;
});

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
