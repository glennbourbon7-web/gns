<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GNS Newsroom</title>
<meta name="description" content="GNS staff portal: write stories and send them to management for approval.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GNS Newsroom">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#18181b">
<script>
  /* Opened from the Home Screen icon: go straight into the newsroom. */
  var NEWSROOM = "https://claude.ai/artifact/3BEmResrzHUsNtMCXqQCZr";
  var fromIcon = /[?&]app=1/.test(location.search) || navigator.standalone === true ||
    (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches));
  if (fromIcon) location.replace(NEWSROOM);
</script>
<style>
  :root { --bg: #141416; --ink: #f4f4f5; --muted: #a1a1aa; --accent: #8b7cf6; --card: #1f1f23; --line: #2e2e33; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(120% 80% at 50% 0%, #26232f 0%, var(--bg) 60%); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: grid; place-items: center;
         padding: calc(env(safe-area-inset-top, 0px) + 32px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
  main { width: 100%; max-width: 420px; text-align: center; display: grid; gap: 18px; justify-items: center; }
  .icon { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); }
  h1 { margin: 6px 0 0; font-size: 32px; letter-spacing: -.01em; }
  p { margin: 0; color: var(--muted); line-height: 1.45; }
  .btn { display: block; width: 100%; padding: 15px 18px; border-radius: 12px; font-size: 17px; font-weight: 700; text-decoration: none; border: 0; cursor: pointer; font-family: inherit; }
  .primary { background: var(--accent); color: #111; }
  .secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .stack { width: 100%; display: grid; gap: 10px; margin-top: 6px; }
  small { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon-512.png" alt="">
  <h1>GNS Newsroom</h1>
  <p>Write stories, submit cartoons and send them to management for approval. Approved work goes live on GNS automatically.</p>
  <div class="stack">
    <button type="button" class="btn primary" data-install-app>Add to Home Screen</button>
    <a class="btn secondary" href="https://claude.ai/artifact/3BEmResrzHUsNtMCXqQCZr">Open the Newsroom</a>
  </div>
  <small>Staff only. Sign in with your GNS Newsroom username and password.</small>
</main>
<script src="install.js" data-name="GNS Newsroom" data-icon="apple-touch-icon.png" data-accent="#8b7cf6" data-theme="dark" data-tagline="The newsroom on your Home Screen" defer></script>
</body>
</html>
